<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <g id="Frame_01_Feed_Principal_Light">

    <rect width="1440" height="900" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    <!-- Top App Bar -->
    <g id="Top_App_Bar_Light">
      <rect width="1440" height="64" fill="#FFFFFF"/>
      <line x1="0" y1="64" x2="1440" y2="64" stroke="#E0E0E0" stroke-width="1"/>
      <rect x="64" y="13" width="38" height="38" rx="10" fill="#F5A518"/>
      <rect x="73" y="20" width="20" height="24" rx="3" fill="#FFF9E8"/>
      <text x="114" y="40" font-family="Inter, sans-serif" font-weight="800" font-size="24" fill="#22272E">Note</text>
      <text x="172" y="40" font-family="Inter, sans-serif" font-weight="800" font-size="24" fill="#F5A518">Keep</text>
      <text x="234" y="40" font-family="Inter, sans-serif" font-weight="800" font-size="24" fill="#22272E">App</text>
      <!-- Search Bar -->
      <rect x="360" y="8" width="680" height="48" rx="8" fill="#F1F3F4"/>
      <text x="404" y="37" font-family="Roboto, sans-serif" font-size="15" fill="#5F6368">Pesquisar suas notas...</text>
      <rect x="930" y="20" width="90" height="24" rx="6" fill="#E0E0E0"/>
      <text x="942" y="36" font-family="Roboto, sans-serif" font-weight="600" font-size="11" fill="#5F6368">⌘K / Ctrl+K</text>
      <!-- Avatar -->
      <circle cx="1396" cy="32" r="18" fill="#F1F3F4" stroke="#E0E0E0"/>
    </g>

    <!-- Sidebar -->
    <g id="Sidebar_Light">
      <rect x="0" y="65" width="280" height="835" fill="#FFFFFF"/>
      <rect x="0" y="80" width="268" height="44" rx="22" fill="#FEEFC3"/>
      <text x="64" y="107" font-family="Roboto, sans-serif" font-weight="600" font-size="14" fill="#202124">💡 Notas</text>
      <text x="64" y="155" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#5F6368">📋 Quadro Kanban</text>
      <text x="64" y="203" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#5F6368">🔒 Cofre Seguro (AES)</text>
      <text x="64" y="251" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#5F6368">🔔 Lembretes</text>
      <line x1="24" y1="280" x2="256" y2="280" stroke="#E0E0E0"/>
      <text x="24" y="308" font-family="Roboto, sans-serif" font-weight="700" font-size="11" fill="#80868B">MARCADORES</text>
      <text x="64" y="344" font-family="Roboto, sans-serif" font-size="14" fill="#5F6368">🏷️ Trabalho</text>
      <text x="64" y="384" font-family="Roboto, sans-serif" font-size="14" fill="#5F6368">🏷️ Ideias</text>
      <text x="64" y="424" font-family="Roboto, sans-serif" font-size="14" fill="#5F6368">🏷️ Estudos</text>
      <line x1="24" y1="456" x2="256" y2="456" stroke="#E0E0E0"/>
      <text x="64" y="492" font-family="Roboto, sans-serif" font-size="14" fill="#5F6368">📦 Arquivo</text>
      <text x="64" y="532" font-family="Roboto, sans-serif" font-size="14" fill="#5F6368">🗑️ Lixeira</text>
      <line x1="24" y1="564" x2="256" y2="564" stroke="#E0E0E0"/>
      <rect x="0" y="580" width="268" height="44" rx="22" fill="#F8FAFD"/>
      <text x="64" y="607" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#1A73E8">✨ Assistente IA (NOVO)</text>
    </g>

    <!-- Note Creator Expanded -->
    <g id="Note_Creator_Expanded">
      <rect x="520" y="96" width="600" height="132" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
      <text x="544" y="130" font-family="Roboto, sans-serif" font-weight="600" font-size="16" fill="#202124">Requisitos do Trabalho de Engenharia de Software</text>
      <text x="544" y="160" font-family="Roboto, sans-serif" font-size="14" fill="#5F6368">Mapear casos de uso, banco SQLite (keep.db) e protótipo Figma... (Digite / para comandos)</text>
      <line x1="544" y1="184" x2="1096" y2="184" stroke="#F1F3F4"/>
      <text x="544" y="210" font-family="Roboto, sans-serif" font-size="12" fill="#5F6368">🎨 Cor   🏷️ Marcador   ☑️ Checklist   🎤 Voz   🖼️ Imagem/OCR   📦 Arquivar</text>
      <text x="1048" y="210" font-family="Roboto, sans-serif" font-weight="600" font-size="13" fill="#202124">Fechar</text>
    </g>

    <!-- Section FIXADAS -->
    <text x="320" y="272" font-family="Roboto, sans-serif" font-weight="700" font-size="11" fill="#80868B">FIXADAS</text>
    <g id="Card_Seed_1_Sand">
      <rect x="310" y="290" width="340" height="220" rx="8" fill="#FFF8B8" stroke="#E0E0E0"/>
      <text x="334" y="324" font-family="Roboto, sans-serif" font-weight="700" font-size="16" fill="#202124">Primeiros passos 📌</text>
      <text x="334" y="356" font-family="Roboto, sans-serif" font-size="13" fill="#202124">• Crie notas de texto ou checklists</text>
      <text x="334" y="380" font-family="Roboto, sans-serif" font-size="13" fill="#202124">• Alterne entre temas Claro e Escuro</text>
      <text x="334" y="404" font-family="Roboto, sans-serif" font-size="13" fill="#202124">• Escolha entre as 12 cores originais MD3</text>
      <text x="334" y="428" font-family="Roboto, sans-serif" font-size="13" fill="#202124">• Busca em tempo real no topo (Ctrl+K)</text>
      <rect x="334" y="464" width="64" height="24" rx="12" fill="#000000" fill-opacity="0.08"/>
      <text x="350" y="480" font-family="Roboto, sans-serif" font-weight="600" font-size="11" fill="#202124">Ideias</text>
    </g>

    <g id="Card_Seed_2_Dusk">
      <rect x="675" y="290" width="340" height="220" rx="8" fill="#D3BFDB" stroke="#E0E0E0"/>
      <text x="699" y="324" font-family="Roboto, sans-serif" font-weight="700" font-size="16" fill="#202124">Assistente de IA 📌</text>
      <text x="699" y="356" font-family="Roboto, sans-serif" font-size="13" fill="#202124">1. Clique na aba IA no menu lateral</text>
      <text x="699" y="380" font-family="Roboto, sans-serif" font-size="13" fill="#202124">2. Insira sua chave do Google AI Studio</text>
      <text x="699" y="404" font-family="Roboto, sans-serif" font-size="13" fill="#202124">3. Peça resumos, planos de ação ou OCR</text>
      <text x="699" y="428" font-family="Roboto, sans-serif" font-size="13" fill="#202124">4. Salve a resposta como nova nota</text>
      <rect x="699" y="464" width="72" height="24" rx="12" fill="#000000" fill-opacity="0.08"/>
      <text x="714" y="480" font-family="Roboto, sans-serif" font-weight="600" font-size="11" fill="#202124">Estudos</text>
    </g>

    <g id="Card_Seed_3_Mint">
      <rect x="1040" y="290" width="340" height="220" rx="8" fill="#E2F6D3" stroke="#E0E0E0"/>
      <text x="1064" y="324" font-family="Roboto, sans-serif" font-weight="700" font-size="16" fill="#202124">Tarefas da Semana</text>
      <text x="1064" y="356" font-family="Roboto, sans-serif" font-size="13" fill="#5F6368">☑ Testar criação de notas coloridas</text>
      <text x="1064" y="380" font-family="Roboto, sans-serif" font-size="13" fill="#5F6368">☑ Experimentar o modo escuro</text>
      <text x="1064" y="404" font-family="Roboto, sans-serif" font-size="13" fill="#202124">☐ Adicionar marcadores personalizados</text>
      <text x="1064" y="428" font-family="Roboto, sans-serif" font-size="13" fill="#202124">☐ Conversar com a IA sobre as tarefas</text>
      <rect x="1064" y="464" width="76" height="24" rx="12" fill="#000000" fill-opacity="0.08"/>
      <text x="1079" y="480" font-family="Roboto, sans-serif" font-weight="600" font-size="11" fill="#202124">Trabalho</text>
    </g>
  </g>
</svg>
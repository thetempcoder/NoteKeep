<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="740" viewBox="0 0 3000 740" fill="none">
  <g id="Frame_05_Design_System_Arquitetura">

    <rect width="3000" height="740" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    <text x="40" y="52" font-family="Inter, sans-serif" font-weight="800" font-size="22" fill="#202124">1. Paleta Oficial de Cartões (KEEP_COLORS — Light &amp; Dark Theme)</text>
    <!-- 12 Swatches -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="210" height="90" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/><text x="16" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Padrão (default)</text><text x="16" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#5F6368">#FFFFFF / #202124</text>
      <rect x="230" y="0" width="210" height="90" rx="10" fill="#FAAFA8" stroke="#E0E0E0"/><text x="246" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Coral (coral)</text><text x="246" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#FAAFA8 / #77172E</text>
      <rect x="460" y="0" width="210" height="90" rx="10" fill="#F39F76" stroke="#E0E0E0"/><text x="476" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Pêssego (peach)</text><text x="476" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#F39F76 / #692B17</text>
      <rect x="690" y="0" width="210" height="90" rx="10" fill="#FFF8B8" stroke="#E0E0E0"/><text x="706" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Areia (sand)</text><text x="706" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#FFF8B8 / #7C4A03</text>
      <rect x="920" y="0" width="210" height="90" rx="10" fill="#E2F6D3" stroke="#E0E0E0"/><text x="936" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Menta (mint)</text><text x="936" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#E2F6D3 / #264D3B</text>
      <rect x="1150" y="0" width="210" height="90" rx="10" fill="#B4DDD3" stroke="#E0E0E0"/><text x="1166" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Sálvia (sage)</text><text x="1166" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#B4DDD3 / #0C625D</text>
      <rect x="1380" y="0" width="210" height="90" rx="10" fill="#D4E4ED" stroke="#E0E0E0"/><text x="1396" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Névoa (fog)</text><text x="1396" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#D4E4ED / #256377</text>
      <rect x="1610" y="0" width="210" height="90" rx="10" fill="#AECCDC" stroke="#E0E0E0"/><text x="1626" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Tempestade (storm)</text><text x="1626" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#AECCDC / #284255</text>
      <rect x="1840" y="0" width="210" height="90" rx="10" fill="#D3BFDB" stroke="#E0E0E0"/><text x="1856" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Crepúsculo (dusk)</text><text x="1856" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#D3BFDB / #472E5B</text>
      <rect x="2070" y="0" width="210" height="90" rx="10" fill="#F6E2DD" stroke="#E0E0E0"/><text x="2086" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Flor (blossom)</text><text x="2086" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#F6E2DD / #6C394F</text>
      <rect x="2300" y="0" width="210" height="90" rx="10" fill="#E9E3D4" stroke="#E0E0E0"/><text x="2316" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Argila (clay)</text><text x="2316" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#E9E3D4 / #4B443A</text>
      <rect x="2530" y="0" width="210" height="90" rx="10" fill="#EFEFF1" stroke="#E0E0E0"/><text x="2546" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#202124">Giz (chalk)</text><text x="2546" y="60" font-family="Roboto, sans-serif" font-size="12" fill="#202124">#EFEFF1 / #2D2F31</text>
    </g>

    <!-- Architecture & DER Boxes -->
    <text x="40" y="230" font-family="Inter, sans-serif" font-weight="800" font-size="22" fill="#202124">2. Arquitetura em Camadas, Persistência Híbrida (StorageAdapter) &amp; Esquema SQLite (api/db.php)</text>
    <rect x="40" y="255" width="920" height="440" rx="12" fill="#F8FAFD" stroke="#D2E3FC" stroke-width="2"/>
    <text x="70" y="295" font-family="Roboto, sans-serif" font-weight="700" font-size="18" fill="#1A73E8">Camadas do Sistema (Front-End SPA + Back-End PHP)</text>
    <text x="70" y="335" font-family="Roboto, sans-serif" font-size="15" fill="#202124">• Interface (index.html + styles.css): Masonry Grid 4 colunas, Kanban, IA Studio, Command Palette</text>
    <text x="70" y="370" font-family="Roboto, sans-serif" font-size="15" fill="#202124">• Serviços (app.js + ai.js): NoteKeepApp, AIService, VaultCryptoService, VoiceInputService, SoundFX</text>
    <text x="70" y="405" font-family="Roboto, sans-serif" font-size="15" fill="#202124">• Persistência (StorageAdapter): Tenta API PHP (api/notes.php) com timeout 5s → Fallback LocalStorage</text>
    <text x="70" y="440" font-family="Roboto, sans-serif" font-size="15" fill="#202124">• Verificação Automatizada (tests/app.test.cjs): Testes unitários e de integração via JSDOM</text>

    <rect x="1000" y="255" width="920" height="440" rx="12" fill="#FFFDF5" stroke="#F5A518" stroke-width="2"/>
    <text x="1030" y="295" font-family="Roboto, sans-serif" font-weight="700" font-size="18" fill="#C97D00">Modelo Entidade-Relacionamento (SQLite: data/keep.db)</text>
    <text x="1030" y="335" font-family="Roboto, sans-serif" font-weight="700" font-size="15" fill="#202124">Tabela: notes</text>
    <text x="1030" y="365" font-family="Roboto, sans-serif" font-size="14" fill="#5F6368">id (TEXT PK), title (TEXT), content (TEXT), type (TEXT: text/checklist), checklist_items (JSON),</text>
    <text x="1030" y="390" font-family="Roboto, sans-serif" font-size="14" fill="#5F6368">color (TEXT), is_pinned (INT), is_archived (INT), is_trashed (INT), labels (JSON), reminder (TEXT),</text>
    <text x="1030" y="415" font-family="Roboto, sans-serif" font-size="14" fill="#5F6368">is_locked (INT), encrypted_data (TEXT AES-GCM), created_at (DATETIME), updated_at (DATETIME)</text>
    <text x="1030" y="460" font-family="Roboto, sans-serif" font-weight="700" font-size="15" fill="#202124">Tabela: labels</text>
    <text x="1030" y="490" font-family="Roboto, sans-serif" font-size="14" fill="#5F6368">id (TEXT PK), name (TEXT UNIQUE), created_at (DATETIME)</text>

    <rect x="1960" y="255" width="980" height="440" rx="12" fill="#F1F8F4" stroke="#34A853" stroke-width="2"/>
    <text x="1990" y="295" font-family="Roboto, sans-serif" font-weight="700" font-size="18" fill="#1E8E3E">Requisitos de Engenharia de Software (RF &amp; RNF)</text>
    <text x="1990" y="335" font-family="Roboto, sans-serif" font-size="15" fill="#202124">• RF01: CRUD de notas de texto e listas de tarefas (checklists) com fixação e arquivo</text>
    <text x="1990" y="370" font-family="Roboto, sans-serif" font-size="15" fill="#202124">• RF02: Cofre Criptografado Zero-Knowledge com AES-256 GCM e PBKDF2 SHA-256</text>
    <text x="1990" y="405" font-family="Roboto, sans-serif" font-size="15" fill="#202124">• RF03: Assistente IA (Gemini 3.6 Flash) com seleção de contexto e OCR de imagens</text>
    <text x="1990" y="440" font-family="Roboto, sans-serif" font-size="15" fill="#202124">• RF04: Quadro Kanban Ágil com movimentação automática por progresso</text>
    <text x="1990" y="475" font-family="Roboto, sans-serif" font-size="15" fill="#202124">• RF05: Command Palette (Ctrl+K), Slash Commands (/) e Voice-to-Action (pt-BR)</text>
  </g>
</svg>